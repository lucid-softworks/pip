# Railway service config for pip-server.
# Provision a Postgres plugin alongside this service and Railway will inject
# DATABASE_URL automatically. Set BETTER_AUTH_SECRET, BETTER_AUTH_URL (the
# public Railway URL of this service), and TRUSTED_ORIGINS in the dashboard.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Only rebuild when something the server image actually depends on changes.
# Mobile-only changes (App.tsx, src/, assets/, ios/, eas.json, etc.) won't
# trigger a Railway redeploy.
watchPatterns = [
  "server/**",
  "Dockerfile",
  ".dockerignore",
  "railway.toml",
]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/"
healthcheckTimeout = 30
